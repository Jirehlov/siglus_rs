[package]
name = "avg32"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
encoding_rs = "0.8"
siglus_assets = { path = "../siglus_assets" }

[features]
desktop-player = ["dep:ab_glyph", "dep:bytemuck", "dep:clap", "dep:pollster", "dep:wgpu", "dep:winit"]

[target.'cfg(not(target_os = "horizon"))'.dependencies]
kira.workspace = true
oxideav-cinepak = { version = "0.0.3", default-features = false }
ab_glyph = { version = "0.2", optional = true }
bytemuck = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[[bin]]
name = "avg32_player"
path = "src/bin/avg32_player.rs"
required-features = ["desktop-player"]

[lints]
workspace = true
